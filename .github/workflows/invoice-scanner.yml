name: Invoice Scanner

on:
  schedule:
    # 每30分钟运行一次（UTC时间，北京时间=UTC+8）
    # 06:00 UTC = 14:00 北京时间
    - cron: '*/30 * * * *'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      scan_days:
        description: '扫描最近几天的邮件'
        required: false
        default: '7'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run invoice scanner
        env:
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SCAN_DAYS: ${{ github.event.inputs.scan_days || '7' }}
        run: |
          python invoice_scanner.py
